services:
  reachtrail-app:
    image: ${APP_IMAGE}
    container_name: reachtrail-app
    restart: unless-stopped
    volumes:
      - ${APP_ROOT}:/usr/share/nginx/html:ro
    environment:
      - VIRTUAL_HOST=${APP_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${APP_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - proxy-net

  reachtrail-api:
    image: ${API_IMAGE}
    container_name: reachtrail-api
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ${API_DATA_ROOT}:/app/data
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=${API_DOMAIN}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${API_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_ALLOWED_CLIENT_IDS=${GOOGLE_ALLOWED_CLIENT_IDS}
      - SESSION_SECRET=${SESSION_SECRET}
      - USER_STORE_PATH=/app/data/reachtrail-users.json
      - YAHOO_API_KEY=${YAHOO_API_KEY}
    networks:
      - proxy-net

  reachtrail-download:
    image: ${DOWNLOAD_IMAGE}
    container_name: reachtrail-download
    restart: unless-stopped
    volumes:
      - ${DOWNLOAD_ROOT}:/usr/share/nginx/html:ro
    environment:
      - VIRTUAL_HOST=${DOWNLOAD_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOWNLOAD_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - proxy-net

networks:
  proxy-net:
    name: global-proxy-network
    external: true
